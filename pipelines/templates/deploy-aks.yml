# Reusable deployment job: one template, called once per environment (dev, then prod).
# Same steps for both, so dev really is a rehearsal of prod.
parameters:
  - name: environment        # dev | prod: picks the Key Vault secrets and the k8s overlay
    type: string
  - name: adoEnvironment     # Azure DevOps Environment; the prod approval lives there, not in YAML
    type: string
  - name: namespace
    type: string
  - name: hostPrefix         # site = <hostPrefix>.<appDomain>
    type: string
  - name: useSelfHostedAgent
    type: boolean
    default: true
  - name: selfHostedPool
    type: string
    default: Agent-VM

jobs:
  - deployment: deploy_${{ parameters.environment }}
    displayName: Deploy to ${{ parameters.namespace }}
    environment: ${{ parameters.adoEnvironment }}
    pool:
      ${{ if eq(parameters.useSelfHostedAgent, true) }}:
        name: ${{ parameters.selfHostedPool }}
      ${{ else }}:
        vmImage: ubuntu-latest
    variables:
      host: ${{ parameters.hostPrefix }}.$(appDomain)
    strategy:
      runOnce:
        deploy:
          steps:
            # Deployment jobs download the "manifests" artifact to $(Pipeline.Workspace)/manifests automatically.
            - task: AzureCLI@2
              displayName: Apply manifests to ${{ parameters.namespace }}
              inputs:
                azureSubscription: $(azureServiceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  NS=${{ parameters.namespace }}

                  echo "##[section]1/7 Connect to the cluster"
                  az aks get-credentials -g $(aksResourceGroup) -n $(aksClusterName) --overwrite-existing
                  kubectl version --client

                  echo "##[section]2/7 Look up the database host (it can live in a fallback region, so we never hard-code it)"
                  DB_HOST=$(az postgres flexible-server list -g $(aksResourceGroup) --query "[0].fullyQualifiedDomainName" -o tsv)
                  [ -n "$DB_HOST" ] || { echo "##[error]No PostgreSQL server found in $(aksResourceGroup)"; exit 1; }
                  echo "DB host: $DB_HOST"

                  echo "##[section]3/7 Namespace, then the Secret built from Key Vault values"
                  kubectl create namespace $NS --dry-run=client -o yaml | kubectl apply -f -
                  kubectl -n $NS create secret generic shackpulse-secrets \
                    --from-literal=DB_PASSWORD="$DB_PASSWORD" \
                    --from-literal=JWT_SECRET="$JWT_SECRET" \
                    --from-literal=SEED_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
                    --dry-run=client -o yaml | kubectl apply -f -

                  echo "##[section]4/7 Fill in this build's values"
                  OVERLAY=$(Pipeline.Workspace)/manifests/overlays/${{ parameters.environment }}
                  sed -i \
                    -e "s|__ACR_LOGIN_SERVER__|$(acrLoginServer)|g" \
                    -e "s|__IMAGE_TAG__|$(imageTag)|g" \
                    -e "s|__APP_HOST__|$(host)|g" \
                    -e "s|__DB_HOST__|$DB_HOST|g" \
                    -e "s|__APP_VERSION__|1.0.$(Build.BuildId)|g" \
                    -e "s|__BUILD_ID__|$(Build.BuildNumber)|g" \
                    -e "s|__COMMIT_SHA__|$(Build.SourceVersion)|g" \
                    $OVERLAY/kustomization.yaml
                  # Any placeholder left outside a comment means a value is missing: stop before applying.
                  if grep -nE "__[A-Z_]+__" $OVERLAY/kustomization.yaml | grep -vE '^[0-9]+:[[:space:]]*#'; then echo "##[error]Unfilled placeholders above"; exit 1; fi
                  echo "----- rendered manifests -----"
                  kubectl kustomize $OVERLAY

                  echo "##[section]5/7 Apply and wait for the rollout"
                  kubectl apply -k $OVERLAY
                  if ! kubectl -n $NS rollout status deploy/shackpulse-api --timeout=300s; then
                    echo "##[error]API rollout failed. Recent events and the crashed container's own log:"
                    kubectl -n $NS get events --sort-by=.lastTimestamp | tail -20
                    kubectl -n $NS logs deploy/shackpulse-api --previous --tail=50 || kubectl -n $NS logs deploy/shackpulse-api --tail=50 || true
                    exit 1
                  fi
                  kubectl -n $NS rollout status deploy/shackpulse-web --timeout=180s

                  echo "##[section]6/7 Check the route is attached to the shared Gateway, and the HTTPS certificate is ready"
                  # The platform Gateway (namespace shackpulse-gateway) must accept our HTTPRoute. "Accepted=False"
                  # usually means the route points at the wrong listener (sectionName) or namespace.
                  if ! kubectl -n $NS wait httproute/shackpulse --timeout=120s \
                       --for=jsonpath='{.status.parents[0].conditions[?(@.type=="Accepted")].status}'=True; then
                    echo "##[error]The Gateway did not accept the HTTPRoute:"
                    kubectl -n $NS describe httproute shackpulse | tail -25
                    exit 1
                  fi
                  # Certificates belong to the Gateway, so they live in the Gateway's namespace.
                  CERT=shackpulse-${{ parameters.environment }}-tls
                  if ! kubectl -n shackpulse-gateway wait certificate/$CERT --for=condition=Ready --timeout=300s; then
                    echo "##[warning]Certificate $CERT not ready yet. Common causes: the domain's nameservers don't point at Azure DNS yet, or DNS hasn't spread."
                    kubectl -n shackpulse-gateway describe certificate $CERT | tail -20 || true
                    kubectl -n shackpulse-gateway get challenges -o wide || true
                  fi
                  kubectl -n $NS get pods,svc,httproute -o wide
                  kubectl -n shackpulse-gateway get gateway shackpulse-gateway
              env:
                DB_PASSWORD: $(${{ parameters.environment }}-db-password)
                JWT_SECRET: $(${{ parameters.environment }}-jwt-secret)
                ADMIN_PASSWORD: $(${{ parameters.environment }}-admin-password)

            - script: |
                set -euo pipefail
                URL="https://$(host)"
                echo "##[section]7/7 Smoke test $URL"
                ok=""
                for i in $(seq 1 30); do
                  if curl -fsS "$URL/api/info" -o info.json; then ok=yes; break; fi
                  echo "waiting for DNS / certificate / pods... ($i/30)"; sleep 10
                done
                K=""
                if [ -z "$ok" ]; then
                  # The Gateway redirects plain HTTP to HTTPS, so we stay on HTTPS and skip certificate checks (-k)
                  # until Let's Encrypt has issued the real certificate.
                  echo "##[warning]No trusted certificate yet (DNS or Let's Encrypt still pending). Verifying the deploy over HTTPS with -k."
                  K="-k"; curl $K -fsS "$URL/api/info" -o info.json
                fi
                cat info.json; echo
                grep -q '"environment":"${{ parameters.environment }}"' info.json
                grep -q '"buildId":"$(Build.BuildNumber)"' info.json
                grep -q '"database":"PostgreSQL' info.json
                curl $K -fsS "$URL/readyz"; echo
                code=$(curl $K -s -o /dev/null -w '%{http_code}' "$URL/api/projects")
                [ "$code" = 401 ] || { echo "##[error]/api/projects should require a login (got $code)"; exit 1; }
                echo "##[section]${{ parameters.namespace }} is serving build $(Build.BuildNumber) at $URL"
              displayName: Smoke test ${{ parameters.hostPrefix }}.<domain>
